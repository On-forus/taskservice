services:
  db:
    image: postgres:17-alpine
    container_name: taskservice
    restart: always

    environment:
      POSTGRES_DB: taskservice
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - taskservice:/var/lib/postgresql/data

  app:
    build: .
    container_name: taskservice-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  taskservice:
